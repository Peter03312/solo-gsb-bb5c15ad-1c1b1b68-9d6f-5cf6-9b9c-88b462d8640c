<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>负责人结算台 · 三角嗅辨盲评</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <header class="hero">
    <h1>负责人结算台</h1>
    <p><a href="/">← 返回首页</a></p>
  </header>

  <div id="app"></div>
</div>

<script src="/static/app.js"></script>
<script>
const appEl = document.getElementById('app');
const params = new URLSearchParams(location.search);
const code = params.get('test');
const token = params.get('token');
let timer = null;

if (!code || !token) {
  appEl.innerHTML = `<div class="card"><div class="callout err">
    缺少测试码或令牌。请从<a href="/">首页</a>创建或重新打开。</div></div>`;
} else {
  load();
}

async function load() {
  try {
    const t = await api(`/api/tests/${encodeURIComponent(code)}?token=${encodeURIComponent(token)}`);
    render(t);
  } catch (err) {
    appEl.innerHTML = `<div class="card"><div class="callout err">${esc(err.message)}</div>
      <p class="small"><a href="/">返回首页</a></p></div>`;
  }
}

function render(t) {
  const srvOffset = t.now - Date.now();  // 倒计时以服务端时钟为准
  const remain = t.deadline - (Date.now() + srvOffset);
  const past = remain <= 0;
  appEl.innerHTML = `
    <div class="card">
      <h2>测试 <span class="mono">${esc(t.test_code)}</span></h2>
      <p class="small">样本 A：<b>${esc(t.sample_a)}</b> ｜ 样本 B：<b>${esc(t.sample_b)}</b></p>
      <p class="small">截止时间：<b>${fmtTime(t.deadline)}</b>
        ｜ 最少有效答卷：<b>${t.min_valid}</b> 份</p>
      <p class="small">距截止：<b id="countdown" style="font-size:16px">${esc(fmtCountdown(remain))}</b></p>
      <div class="stat-grid">
        <div class="stat"><div class="num">${t.progress.total}</div><div class="cap">评员总数</div></div>
        <div class="stat"><div class="num">${t.progress.submitted}</div><div class="cap">已提交(含弃权)</div></div>
        <div class="stat"><div class="num">${t.progress.valid}</div><div class="cap">有效答卷</div></div>
        <div class="stat"><div class="num">${t.withdrawn_count || 0}</div><div class="cap">已撤回</div></div>
      </div>
      <p class="hint">截止前仅显示汇总计数，不显示任何评员的答案与三杯对应关系，以防泄露。</p>
      <button id="settleBtn" ${(!past || t.settled) ? 'disabled' : ''}>
        ${t.settled ? '已结算（结果已冻结）' : past ? '立即结算' : '截止后才能结算'}
      </button>
      <div id="settleMsg"></div>
      <div id="report"></div>
    </div>

    <div class="card">
      <h2>名单调整（截止前 · 缺席处理）</h2>
      <p class="hint">
        可只补位、只撤回，或一次操作同时撤回并补位。仅<b>未提交</b>者可撤回；
        已作答或已弃权者不可撤回，撤回后的旧码立即失效。补位评员取得新专属码，
        同一实验姓名不得重用；已有评员的杯序、异样样本与答卷不变，
        新分配会尽量均衡异样杯位置与异样样本。
        调整后有效人数须在 <b>${t.min_valid}</b> ～ <b>500</b> 人之间，
        任一校验失败则整次操作无效。
      </p>
      ${(past || t.settled) ? `
        <div class="callout ${t.settled ? 'no' : 'warn'}">
          ${t.settled ? '测试已结算，名单已冻结，不能调整。' : '已过截止时间，不能调整名单。'}
        </div>` : `
        <label>要撤回的盲评码（每行一个；可留空表示只补位）</label>
        <textarea id="withdrawCodes" rows="3"
          placeholder="贴入缺席评员的盲评码，每行一个"></textarea>
        <label>补位评员姓名（每行一个；可留空表示只撤回）</label>
        <textarea id="addPanelists" rows="3"
          placeholder="新评员姓名，每行一个"></textarea>
        <button id="adjustBtn">执行调整</button>
        <div id="adjustMsg"></div>`}
    </div>

    <div class="card">
      <h2>盲评码分发名单（仅负责人可见）</h2>
      <p class="hint">请将每人的专属链接单独发给本人；盲评码不可重复使用。</p>
      <table>
        <thead><tr><th>评员</th><th>盲评码 / 专属链接</th></tr></thead>
        <tbody>
          ${t.codes.map(c => `
            <tr>
              <td>${esc(c.panelist)}</td>
              <td class="code">${esc(c.code)}
                <a href="${esc(c.url)}" target="_blank" class="small">打开</a></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="card">
      <h2>操作时间线</h2>
      <p class="hint">创建、名单调整、答卷/弃权与结算按提交顺序逐笔记录（服务端时间）。
        结算前答卷只显示「已作答 / 已弃权」，结算后才显示选杯与判定。</p>
      <div id="timeline"><p class="small">加载中…</p></div>
    </div>`;

  clearInterval(timer);
  timer = setInterval(() => {
    const el = document.getElementById('countdown');
    if (el) el.textContent = fmtCountdown(t.deadline - (Date.now() + srvOffset));
    const btn = document.getElementById('settleBtn');
    if (btn && !t.settled && t.deadline - (Date.now() + srvOffset) <= 0 && btn.disabled) {
      btn.disabled = false;
      btn.textContent = '立即结算';
    }
  }, 1000);

  document.getElementById('settleBtn').addEventListener('click', doSettle);
  const adjustBtn = document.getElementById('adjustBtn');
  if (adjustBtn) adjustBtn.addEventListener('click', doAdjust);
  if (t.settled) doSettle();
  loadTimeline();
}

const EVENT_LABELS = {
  created: '创建实验',
  roster_adjusted: '名单调整',
  answer: '提交答卷',
  abstain: '弃权',
  settled: '结算',
  recording_started: '记录起点',
};

function eventDetail(ev) {
  const d = ev.detail || {};
  switch (ev.type) {
    case 'created':
      return `样本 A「${esc(d.sample_a)}」/ B「${esc(d.sample_b)}」，` +
        `${d.panelist_count} 名评员，截止 ${fmtTime(d.deadline)}，` +
        `最少有效 ${d.min_valid} 份`;
    case 'roster_adjusted': {
      const parts = [];
      if (d.withdrawn && d.withdrawn.length)
        parts.push('撤回：' + d.withdrawn.map(x => `${esc(x.panelist)}（旧码 ${esc(x.code)}）`).join('、'));
      if (d.added && d.added.length)
        parts.push('补位：' + d.added.map(x => `${esc(x.panelist)}（新码 ${esc(x.code)}）`).join('、'));
      parts.push(`调整后有效名单 ${d.active_count} 人`);
      return parts.join('；');
    }
    case 'answer':
      return d.answer === undefined
        ? '已作答（结算前不公开选杯与判定）'
        : `选 ${d.answer} 号杯 · ${d.correct ? '<span class="badge ok">答对</span>' : '<span class="badge no">答错</span>'}`;
    case 'abstain':
      return '已弃权';
    case 'settled':
      return `有效 ${d.valid_count} / 答对 ${d.correct_count} / 弃权 ${d.abstained_count} / ` +
        `未交 ${d.missing_count}，p=${d.p_value === null ? '—' : Number(d.p_value).toFixed(4)}，` +
        (d.distinguishable ? '<span class="badge ok">判为可辨</span>' : '<span class="badge no">不可判为可辨</span>');
    case 'recording_started':
      return esc(d.note || '此前操作无记录，时间线自此开始');
    default:
      return '';
  }
}

async function loadTimeline() {
  const el = document.getElementById('timeline');
  if (!el) return;
  try {
    const r = await api(`/api/tests/${encodeURIComponent(code)}/timeline?token=${encodeURIComponent(token)}`);
    if (!r.events.length) {
      el.innerHTML = '<p class="small">暂无记录。</p>';
      return;
    }
    const incomplete = r.history_complete ? '' : `
      <div class="callout warn">该实验创建于时间线功能上线前，既往操作无逐笔记录；
        下方自「记录起点」开始，之前的历史未被虚构补全。</div>`;
    el.innerHTML = incomplete + `
      <table>
        <thead><tr><th>#</th><th>服务端时间</th><th>操作</th><th>评员</th><th>结果 / 明细</th></tr></thead>
        <tbody>
          ${r.events.map(ev => `
            <tr>
              <td>${ev.seq}</td>
              <td class="small">${fmtTime(ev.at)}</td>
              <td>${EVENT_LABELS[ev.type] || esc(ev.type)}</td>
              <td>${ev.panelist ? esc(ev.panelist) : '—'}</td>
              <td class="small">${eventDetail(ev)}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  } catch (err) {
    el.innerHTML = `<div class="callout err">时间线加载失败：${esc(err.message)}</div>`;
  }
}

async function doAdjust() {
  const msgEl = document.getElementById('adjustMsg');
  const wCodes = document.getElementById('withdrawCodes').value.split('\n')
    .map(s => s.trim()).filter(Boolean);
  const aNames = document.getElementById('addPanelists').value.split('\n')
    .map(s => s.trim()).filter(Boolean);
  if (wCodes.length === 0 && aNames.length === 0) {
    showErr(msgEl, '请至少填写要撤回的盲评码或补位评员姓名。');
    return;
  }
  const word = (wCodes.length && aNames.length)
    ? `撤回 ${wCodes.length} 人并补位 ${aNames.length} 人`
    : wCodes.length ? `撤回 ${wCodes.length} 人`
    : `补位 ${aNames.length} 人`;
  if (!confirm(`确认${word}？任一校验失败将整次无效（不产生任何改动）。`)) return;

  const btn = document.getElementById('adjustBtn');
  btn.disabled = true; btn.textContent = '调整中…';
  try {
    const r = await api(`/api/tests/${encodeURIComponent(code)}/adjust`, {
      method: 'POST',
      body: { token, withdraw_codes: wCodes, add_panelists: aNames },
    });
    const lines = [];
    if (r.withdrawn.length)
      lines.push(`已撤回：${r.withdrawn.map(x => esc(x.panelist)).join('、')}（旧码已立即失效）`);
    if (r.added.length)
      lines.push(`已补位：${r.added.map(x => esc(x.panelist)).join('、')}` +
        `（新盲评码见下方分发名单）`);
    lines.push(`当前有效名单 ${r.progress.total} 人。`);
    showInfo(msgEl, lines.join(' '), 'ok');
    setTimeout(load, 1200);  // 刷新以展示新分发码与计数
  } catch (err) {
    showErr(msgEl, err.message);
    btn.disabled = false; btn.textContent = '执行调整';
  }
}

async function doSettle() {
  const btn = document.getElementById('settleBtn');
  const msgEl = document.getElementById('settleMsg');
  if (btn) { btn.disabled = true; btn.textContent = '结算中…'; }
  try {
    const r = await api(`/api/tests/${encodeURIComponent(code)}/settle`, {
      method: 'POST', body: { token },
    });
    renderReport(r);
    if (btn) { btn.disabled = true; btn.textContent = '已结算（结果已冻结）'; }
    loadTimeline();  // 结算事件入列，答卷事件解锁答案与判定
  } catch (err) {
    showErr(msgEl, err.message);
    if (btn) { btn.disabled = false; btn.textContent = '立即结算'; }
  }
}

function renderReport(r) {
  const el = document.getElementById('report');
  const kind = r.distinguishable ? 'ok' : 'no';
  const label = r.distinguishable
    ? '<span class="badge ok">判为可辨</span>'
    : '<span class="badge no">不可判为可辨</span>';
  el.innerHTML = `
    <h2 style="margin-top:24px">结算结果 ${label}</h2>
    <div class="callout ${kind === 'ok' ? 'ok' : 'warn'}">${esc(r.conclusion)}</div>
    <div class="stat-grid">
      <div class="stat"><div class="num">${r.valid_count}</div><div class="cap">有效答卷</div></div>
      <div class="stat"><div class="num">${r.correct_count}</div><div class="cap">答对</div></div>
      <div class="stat"><div class="num">${r.abstained_count}</div><div class="cap">弃权</div></div>
      <div class="stat"><div class="num">${r.missing_count}</div><div class="cap">未交</div></div>
      <div class="stat"><div class="num">${r.p_value === null ? '—' : r.p_value.toFixed(4)}</div>
        <div class="cap">单侧尾概率 (p=1/3)</div></div>
    </div>
    <p class="hint">判定规则：有效答卷 ≥ ${r.min_valid} 且
      P(X≥答对 | X~Binomial(n,1/3)) ≤ 0.05 才判为可辨。</p>

    <h2>分配与答卷回看（冻结）</h2>
    <table>
      <thead><tr>
        <th>评员</th><th>盲评码</th><th>异样杯位置</th><th>异样杯样本</th>
        <th>提交答案</th><th>判定</th>
      </tr></thead>
      <tbody>
        ${r.assignments.map(a => `
          <tr class="${a.correct === true ? 'hit' : a.correct === false ? 'miss' : ''}">
            <td>${esc(a.panelist)}</td>
            <td class="code">${esc(a.code)}</td>
            <td>${a.odd_pos} 号杯</td>
            <td>样本 ${esc(a.odd_sample)}</td>
            <td>${a.answer === null ? '<span class="badge wait">未交</span>'
                : a.answer === '弃权' ? '<span class="badge wait">弃权</span>'
                : `${a.answer} 号杯`}</td>
            <td>${a.correct === null ? '—'
                : a.correct ? '<span class="badge ok">答对</span>'
                : '<span class="badge no">答错</span>'}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}
</script>
</body>
</html>
